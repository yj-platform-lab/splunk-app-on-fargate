name: Terraform Shared Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-shared
  cancel-in-progress: false

jobs:
  terraform:
    # Use the main branch for the shared infrastructure state.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/shared
        shell: bash
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_availability_zone: ${{ vars.AVAILABILITY_ZONE }}
      TF_VAR_ssh_source_cidr: ${{ vars.SSH_SOURCE_CIDR }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_KEY: ${{ vars.TF_BACKEND_KEY }}
      TF_VERSION: ${{ vars.TF_VERSION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required configuration
        run: |
          set -euo pipefail
          for name in AWS_ROLE_ARN TF_VAR_aws_region TF_VAR_availability_zone TF_VAR_ssh_source_cidr TF_BACKEND_BUCKET TF_BACKEND_KEY TF_VERSION; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required repository variable is missing: $name"
              exit 1
            fi
          done

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      - name: Terraform init
        run: |
          terraform init -no-color \
            -backend-config="bucket=$TF_BACKEND_BUCKET" \
            -backend-config="key=$TF_BACKEND_KEY" \
            -backend-config="region=$TF_VAR_aws_region"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        if: inputs.action != 'destroy'
        run: terraform plan -no-color -lock-timeout=5m -out=tfplan

      - name: Terraform destroy plan
        if: inputs.action == 'destroy'
        run: terraform plan -destroy -no-color -lock-timeout=5m -out=tfplan

      - name: Terraform apply
        if: inputs.action == 'apply' || inputs.action == 'destroy'
        run: terraform apply -no-color -lock-timeout=5m tfplan
